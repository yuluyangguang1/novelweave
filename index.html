<!-- 01 首页（小说列表）                         -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-home" class="page active">
  <div class="header">
    <div class="header-left"><a class="header-home" href="../" title="回到 yu.ai 首页" aria-label="回到 yu.ai 首页"><svg width="36" height="18" viewBox="10.99773 21.210212 41.919409 21.544615" fill="none" aria-hidden="true" style="display:block" shape-rendering="geometricPrecision"><path fill="currentColor" fill-rule="nonzero" d="M 45.733398 42.738164 L 41.73629 42.74254 L 41.737375285 40.707591021 A 8.837729855 8.837729855 0 0 1 35.033243 42.6925 A 9.740960697 9.740960697 0 0 1 28.51017967 39.031266945 A 9.54129909 9.54129909 0 0 0 30.574483343 34.572309406 A 5.656539538 5.656539538 0 0 0 40.949690312 35.859788125 A 5.731507417 5.731507417 0 1 0 30.36305225 31.811447406 A 20.573482539 20.573482539 0 0 0 29.939626863 34.753760946 A 10.585050681 10.585050681 0 0 1 25.033905315 41.358815686 A 9.119239881 9.119239881 0 0 1 16.170606141 41.798000109 A 10.358690137 10.358690137 0 0 1 10.99773 35.965116 L 15.334254529 35.967567318 A 5.681724582 5.681724582 0 0 0 22.398260797 38.369841547 A 5.794782642 5.794782642 0 0 0 26.224521625 33.410801625 A 11.676690311 11.676690311 0 0 1 30.222128469 25.429408656 A 8.710111368 8.710111368 0 0 1 39.623506 24.123591875 A 11.711448395 11.711448395 0 0 1 45.746694422 34.434553 L 45.733398 42.738164 Z M 30.094526056 21.213756042 A 16.078573443 16.078573443 0 0 1 29.91016646 24.94437708 A 10.408995195 10.408995195 0 0 0 26.508015877 29.654686048 A 9.313114857 9.313114857 0 0 1 19.702203 31.849336 A 9.502361152 9.502361152 0 0 1 11.081539 21.210212 L 15.117581783 21.218789633 A 8.087155192 8.087155192 0 0 0 15.266308403 24.200214629 A 5.433496857 5.433496857 0 0 0 23.713621493 26.905294666 A 5.999413958 5.999413958 0 0 0 26.125265219 21.222406323 L 30.094526056 21.213756042 Z M 45.724922 21.217266 L 45.721641413 29.955435791 A 10.838411147 10.838411147 0 0 0 41.754415729 24.702180989 L 41.733828 21.226262 L 45.724922 21.217266 Z"/><circle fill="currentColor" cx="50.450349" cy="40.191867" r="2.466790"/></svg></a><span class="header-sep" aria-hidde     <div id="home-stats" class="home-stats" hidden></div>
    <div style="display:flex;justify-content:flex-end;padding:0 4px 10px;">

      <button class="btn btn-secondary" data-action="ai-long-book" style="font-size:12px;padding:6px 12px;margin-left:8px;">AI 起书（长篇）</button>
    </div>
    <div class="home-empty" id="home-empty">
      <img class="logo-hero" src="icons/icon-512.png" alt="织文织纹 logo" width="76" height="76">
      <div class="empty-title">把设定织成一张不会自相矛盾的网</div>
      <div class="empty-text">长篇写到几十章，前后矛盾不是没注意，是记不住。织文把角色、伏笔、时间线落成可校验的状态，写的时候只喂有预算的上下文。</div>
      <ul class="empty-points">
        <li>11 条机器规则查前后矛盾，带引证、可跳转</li>
        <li>角色 / 世界 / 伏笔 / 状态矩阵，结构化不落空</li>
        <li>纯前端 · 数据只在你浏览器里</li>
      </ul>
      <div class="empty-cta">
        <button class="btn btn-primary" data-action="create-novel">创建第一篇小说</button>
        <button class="btn btn-secondary" data-action="load-demo">载入示例书看看</button>
        <button class="btn btn-secondary" data-action="ai-short-book">AI 起书（短篇）</button>
        <button class="btn btn-secondary" data-action="ai-long-book">AI 起书（长篇）</button>
      </div>
      <p class="empty-key">没有 API Key？续写 / 润色才需要它；不配也能用状态管理与连续性检查。
        <a href="https://yuai-r.cn/key.html" target="_blank" rel="noopener">yu.ai 收录了各家大模型的免费额度，注册即用</a></p>
    </div>
    <div id="novel-list" class="novel-list"></div>
    <button class="btn btn-float" data-action="create-novel" title="新建小说" aria-label="新建小说"><svg class="icon icon-lg"><use href="#i-plus"/></svg></button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 02 工作区（写作 + 角色 + 设定）              -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-workspace" class="page">
  <div class="workspace-layout">
    <!-- 左侧栏：侧边导航 -->
    <aside class="workspace-sidebar" id="workspace-sidebar">
      <!-- 返回按钮与书名由 renderSidebar() 渲染，不要在这里再写一份 -->
      <div class="sidebar-nav" id="sidebar-nav"></div>
      <!-- 子页面区域 -->
      <div id="sidebar-content"></div>
    </aside>
    <!-- 右侧主区域 -->
    <main class="workspace-main" id="workspace-main">
      <!-- 章节写作 -->
      <div class="ws-section active" id="ws-editor">
        <div class="editor-header" id="editor-header"></div>
        <div class="editor-area" id="editor-area"></div>
      </div>
    </main>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 03 AI 工具箱侧面板                          -->
<!-- ═══════════════════════════════════════════ -->
<div class="ai-panel-overlay hidden" id="ai-panel-overlay" data-action="close-ai"></div>
<div class="ai-panel hidden" id="ai-panel">
  <div class="ai-panel-header">
    <div class="ai-panel-title">AI 工具箱</div>
    <button class="ai-panel-close" data-action="close-ai" title="关闭（生成中会同时停止）" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
  </div>
  <!-- 按钮由 app.js 的 AI_TOOLS 表渲染，不要在这里写死 -->
  <div class="ai-panel-tools" id="ai-panel-tools"></div>
  <div class="ai-output" id="ai-output"></div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 04 设置页                                   -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-settings" class="page">
  <div class="header">
    <button class="header-back" data-action="go-home" aria-label="返回"><svg class="icon"><use href="#i-back"/></svg></button>
    <div class="header-title">设置</div>
    <div style="width:40px"></div>
  </div>
  <div class="settings-body" id="settings-body"></div>
</div>

</div><!-- /#app -->

<script src="src/core/text.js"></script>
<script src="src/core/bible.js"></script>
<script src="src/core/rules.js"></script>
<script src="src/core/story.js"></script>
<script src="src/core/context.js"></script>
<script src="src/core/selfcheck.js"></script>
<script src="src/core/project.js"></script>
<script src="src/core/db.js"></script>
<script src="src/demo.js"></script>
<script src="src/core/llm.js"></script>
<script src="src/router.js"></script>
<script src="src/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initApp);
  // file:// 直接打开时不注册，否则每次都会刷一条无意义的 SecurityError
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((e) => {
      console.warn('service worker 注册失败', e);
    }));
  }
</script>
</body>
