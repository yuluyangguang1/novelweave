<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NovelWeave · 织文</title>
  <link rel="stylesheet" href="src/styles/app.css?v=2">
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="theme-color" content="#150e07" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="织文">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="app">

<!-- ═══════════════════════════════════════════ -->
<!-- 01 首页（小说列表）                         -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-home" class="page active">
  <div class="header">
    <div class="header-title">织文</div>
    <button class="header-btn" data-action="go-settings" title="设置">⚙️</button>
  </div>
  <div class="home-body">
    <div class="home-empty" id="home-empty">
      <div class="empty-icon">织</div>
      <div class="empty-text">还没有作品</div>
      <button class="btn btn-primary" data-action="create-novel">创建第一篇小说</button>
    </div>
    <div id="novel-list" class="novel-list"></div>
    <button class="btn btn-float" data-action="create-novel" title="新建小说">＋</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 02 工作区（写作 + 角色 + 设定）              -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-workspace" class="page">
  <div class="workspace-layout">
    <!-- 左侧栏：侧边导航 -->
    <aside class="workspace-sidebar" id="workspace-sidebar">
      <!-- 返回按钮与书名由 renderSidebar() 渲染，不要在这里再写一份 -->
      <div class="sidebar-nav" id="sidebar-nav"></div>
      <!-- 子页面区域 -->
      <div id="sidebar-content"></div>
    </aside>
    <!-- 右侧主区域 -->
    <main class="workspace-main" id="workspace-main">
      <!-- 章节写作 -->
      <div class="ws-section active" id="ws-editor">
        <div class="editor-header" id="editor-header"></div>
        <div class="editor-area" id="editor-area"></div>
      </div>
    </main>
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 03 AI 工具箱侧面板                          -->
<!-- ═══════════════════════════════════════════ -->
<div class="ai-panel-overlay hidden" id="ai-panel-overlay" data-action="close-ai"></div>
<div class="ai-panel hidden" id="ai-panel">
  <div class="ai-panel-header">
    <div class="ai-panel-title">AI 工具箱</div>
    <button class="ai-panel-close" data-action="close-ai" title="关闭（生成中会同时停止）">✕</button>
  </div>
  <!-- 按钮由 app.js 的 AI_TOOLS 表渲染，不要在这里写死 -->
  <div class="ai-panel-tools" id="ai-panel-tools"></div>
  <div class="ai-output" id="ai-output"></div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- 04 设置页                                   -->
<!-- ═══════════════════════════════════════════ -->
<div id="page-settings" class="page">
  <div class="header">
    <button class="header-back" data-action="go-home">←</button>
    <div class="header-title">设置</div>
    <div style="width:40px"></div>
  </div>
  <div class="settings-body" id="settings-body"></div>
</div>

</div><!-- /#app -->

<!-- ═══════════════════════════════════════════ -->
<!-- Script 加载顺序                               -->
<!-- ═══════════════════════════════════════════ -->
<script src="src/core/text.js"></script>
<script src="src/core/bible.js"></script>
<script src="src/core/rules.js"></script>
<script src="src/core/story.js"></script>
<script src="src/core/project.js"></script>
<script src="src/core/db.js"></script>
<script src="src/core/llm.js"></script>
<script src="src/router.js"></script>
<script src="src/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initApp);
  // file:// 直接打开时不注册，否则每次都会刷一条无意义的 SecurityError
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((e) => {
      console.warn('service worker 注册失败', e);
    }));
  }
</script>
</body>
</html>
